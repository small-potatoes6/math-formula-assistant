<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../tools/katex/katex.min.css">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #formula {
      color: #2f2a25;
      font-size: 44px;
      padding: 28px 36px;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="formula"></div>
  <script src="../tools/katex/katex.min.js"></script>
  <script>
    katex.render(String.raw`x=\frac{-b\pm\sqrt{b^2-4ac}}{2a}`, document.getElementById('formula'), {
      throwOnError: false,
      displayMode: true,
      output: 'html'
    });
  </script>
</body>
</html>
